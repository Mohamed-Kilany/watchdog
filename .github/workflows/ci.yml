name: ci

on:
  push:
    branches:
      - master
      - m1-foundations
      - "milestone/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup (installs pinned toolchain from rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: rustup
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: rustup
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup (pinned toolchain)
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  docs-link-check:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check-docs-links.py

  fixtures:
    name: test fixtures (regenerate + verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install ffmpeg and pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: verify committed fixtures match what the generator produces
        run: python3 scripts/generate-fixtures.py --verify

  gate:
    name: all checks
    needs: [fmt, clippy, test, deny, docs-link-check, fixtures]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."
