name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup (installs pinned toolchain from rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: rustup
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: rustup
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup (pinned toolchain)
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  docs-link-check:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check-docs-links.py

  fixtures:
    name: test fixtures (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: verify committed fixtures
        run: python3 scripts/generate-fixtures.py --verify

  isolation:
    name: isolation (no system adb, foreign server on 5037)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup (pinned toolchain)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: start a foreign adb server stub on 5037
        run: |
          python3 -c "
          import socket, threading, time
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', 5037))
          s.listen(8)
          def accept_loop():
              while True:
                  c, _ = s.accept()
                  c.sendall(b'FAIL0000error: foreign adb server (isolation test)')
                  c.close()
          threading.Thread(target=accept_loop, daemon=True).start()
          time.sleep(300)
          " &
          echo "foreign stub bound to 5037 (pid $!)"
        shell: bash
      - name: prove PATH has no adb
        run: |
          if command -v adb >/dev/null 2>&1; then
            echo "adb found at $(command -v adb) but watchdog must not use it" >&2
            echo "CI image includes adb; watchdog independence is proven by the
          foreign 5037 binding above plus CI running no_system_adb_* tests."
          else
            echo "no system adb on PATH (ideal isolation condition)"
          fi
      - name: run no_system_adb tests
        run: cargo test --locked -p watchdog-adb no_system_adb

  android:
    name: android (assembleRelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install Android SDK platform and build tools
        run: |
          # The runner image provides the SDK but not necessarily sdkmanager on
          # PATH, and setup-android@v3 fails trying to install the retired
          # `tools` package. Locate the SDK manager explicitly instead.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          echo "using $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: install Gradle (retry-safe)
        run: |
          set -euo pipefail
          GRADLE_VERSION=9.6.0
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/gradle-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: derive app version from git tag
        run: |
          if TAG=$(git describe --tags --exact-match 2>/dev/null); then
            VERSION="${TAG#v}"
          else
            VERSION="0.1.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "WATCHDOG_APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "app version: ${VERSION}"
      - name: generate CI signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/watchdog-ci.jks" \
            -storepass watchdog-ci -keypass watchdog-ci -alias watchdog \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=watchdog CI,O=watchdog,C=US"
          {
            echo "WATCHDOG_KEYSTORE_FILE=$RUNNER_TEMP/watchdog-ci.jks"
            echo "WATCHDOG_KEYSTORE_PASSWORD=watchdog-ci"
            echo "WATCHDOG_KEY_ALIAS=watchdog"
            echo "WATCHDOG_KEY_PASSWORD=watchdog-ci"
          } >> "$GITHUB_ENV"
      - name: ktlint
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/ktlint" \
            https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" --relative "android/**/*.kt" "android/**/*.kts"
      - name: detekt
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/detekt.jar" \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          java -jar "$RUNNER_TEMP/detekt.jar" \
            --input android/app/src/main/kotlin \
            --config android/detekt.yml \
            --build-upon-default-config \
            --excludes "**/build/**"
      - name: unit tests
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest
      - name: assembleRelease
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: verify APK and record metadata
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -n 5
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          if [ -z "$VERSION_CODE" ]; then
            echo "could not parse versionCode from aapt2 badging output" >&2
            exit 1
          fi
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$(grep -i "SHA-256 digest" "$RUNNER_TEMP/apksigner.txt" | head -n1 | awk -F': ' '{print $2}')
          {
            echo "WATCHDOG_APK_VERSION_NAME=$WATCHDOG_APP_VERSION"
            echo "WATCHDOG_APK_VERSION_CODE=$VERSION_CODE"
            echo "WATCHDOG_APK_SHA256=$SHA256"
            echo "WATCHDOG_APK_SIGNER_SHA256=$CERT"
          } >> "$GITHUB_ENV"
          VERSION_NAME="$WATCHDOG_APP_VERSION" VERSION_CODE="$VERSION_CODE" SHA256="$SHA256" CERT="$CERT" \
          python3 - <<'EOF'
          import json, os
          os.makedirs("android/build", exist_ok=True)
          info = {
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "sha256": os.environ["SHA256"],
              "signerSha256": os.environ["CERT"],
              "commit": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
          }
          with open("android/build/apk-info.json", "w", encoding="utf-8") as f:
              json.dump(info, f, indent=2)
              f.write("\n")
          EOF
          cat android/build/apk-info.json
      - name: rustup (host build with embedded APK)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: build host with the embedded APK and verify `watchdog version`
        env:
          WATCHDOG_APK: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          cargo build --locked -p watchdog
          OUTPUT=$(./target/debug/watchdog version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "embedded APK  $WATCHDOG_APK_VERSION_NAME"
          echo "$OUTPUT" | grep -q "$WATCHDOG_APK_SHA256"
          echo "$OUTPUT" | grep -q "$WATCHDOG_APK_SIGNER_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-android-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/build/apk-info.json
          if-no-files-found: error

  android-instrumented:
    name: android (instrumented, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install Android SDK platform and build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: install Gradle (retry-safe)
        run: |
          set -euo pipefail
          GRADLE_VERSION=9.6.0
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/gradle-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: instrumented tests (virtual scene camera)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back virtualscene -camera-front none
          script: cd android && gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented-results
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore

  gate:
    name: all checks
    needs: [fmt, clippy, test, deny, docs-link-check, fixtures, isolation, android, android-instrumented]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."
