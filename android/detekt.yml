# watchdog remote — detekt overrides.
#
# CI runs detekt with --build-upon-default-config, so only deviations from the
# stock rule set are listed here. The camera controller is a deliberately
# stateful coordinator: a higher function budget and guard-clause returns keep
# the state machine readable without splitting it into artificial classes.

complexity:
  TooManyFunctions:
    thresholdInClasses: 20
    # The capability descriptor has one small helper per control family
    # (modes/ranges/locks/streams/keys); splitting them would hide the schema.
    thresholdInObjects: 30

style:
  ReturnCount:
    max: 6
    excludeGuardClauses: true
  MagicNumber:
    # Protocol constants are meaningful as hex wire values.
    ignoreEnums: true
