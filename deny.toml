# cargo-deny configuration. Run: cargo deny check
# Schema: keep only keys documented for the installed cargo-deny version.

[advisories]
# RUSTSEC-2023-0071 (rsa: Marvin Attack, timing sidechannel) — no patched
# version exists. watchdog uses rsa only for the mandatory ADB AUTH
# (SHA-1 + PKCS#1 v1.5, a legacy scheme fixed by the ADB protocol itself).
# Signing happens once per device connection; an attacker needs precise
# timing over many signatures on a LAN. Accepted risk, revisited in M10;
# documented in docs/security.md.
ignore = ["RUSTSEC-2023-0071"]
# rustls-pemfile is unmaintained (RUSTSEC-2022-0017 / RUSTSEC-2022-0018) but
# remains the standard PEM parser for DER certs/keys; we handle parse errors
# explicitly. Removal would require x509-cert directly (M9).
unmaintained = ["rustls-pemfile"]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
