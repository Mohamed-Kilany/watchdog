<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>watchdog controls</title>
  </head>
  <body>
    <a class="skip-link" href="#controls">Skip to controls</a>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>watchdog</span>
        <span class="tag" id="mode-tag">demo device</span>
      </div>
      <div class="actions">
        <span id="device-status" class="status" role="status" aria-live="polite">ready</span>
        <button id="theme-toggle" class="btn" type="button" aria-label="Toggle dark and light theme">
          Theme: dark
        </button>
        <button id="drift" class="btn" type="button">Simulate drift</button>
        <button id="reset-all" class="btn danger" type="button">Reset all to auto</button>
      </div>
    </header>
    <div
      id="connection-banner"
      class="connection-banner"
      data-testid="connection-banner"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <main class="app">
      <section class="stage" aria-labelledby="stage-title">
        <h1 id="stage-title" class="sr-only">Camera preview</h1>
        <div class="viewfinder" data-testid="viewfinder">
          <div class="scene" aria-hidden="true"></div>
          <wd-region-overlay
            id="metering-overlay"
            data-testid="metering-overlay"
            mode="metering"
            label="Metering region"
            editable
          ></wd-region-overlay>
          <wd-region-overlay
            id="focus-overlay"
            data-testid="focus-overlay"
            mode="focus"
            label="Focus region"
          ></wd-region-overlay>
          <div class="vf-corner">FAKE DEVICE · 1280×720</div>
        </div>
        <div class="region-toolbar" role="group" aria-label="Region editing">
          <span class="toolbar-label">Active region</span>
          <label><input type="radio" name="region-mode" value="metering" checked /> Metering</label>
          <label><input type="radio" name="region-mode" value="focus" /> Focus</label>
          <button id="clear-regions" data-testid="clear-regions" class="btn small" type="button">Clear regions</button>
        </div>
        <p id="region-readout" class="readout" data-testid="region-readout" role="status">
          No regions set
        </p>
      </section>
      <section class="controls" id="controls" aria-labelledby="controls-title">
        <h2 id="controls-title" class="sr-only">Camera controls</h2>
        <wd-control-panel data-testid="panel"></wd-control-panel>
      </section>
      <section class="log" aria-labelledby="log-title">
        <h2 id="log-title">Command log</h2>
        <ol id="command-log" data-testid="command-log"></ol>
      </section>
    </main>
    <dialog
      id="token-dialog"
      class="token-dialog"
      data-testid="token-dialog"
      aria-labelledby="token-title"
      aria-describedby="token-copy"
    >
      <form id="token-form" method="dialog">
        <h2 id="token-title">Host token required</h2>
        <p id="token-copy" class="dialog-copy">
          This host has a bearer token enabled. Paste the token printed by
          <code>watchdog serve</code> or saved during provisioning.
        </p>
        <label class="dialog-label" for="token-input">Bearer token</label>
        <input
          id="token-input"
          class="dialog-input"
          name="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <p id="token-error" class="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="token-cancel" class="btn" type="button">Use demo mode</button>
          <button id="token-submit" class="btn primary" type="submit">Connect</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
