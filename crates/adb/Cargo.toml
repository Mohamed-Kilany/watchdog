[package]
name = "watchdog-adb"
description = "Native Rust implementation of the ADB protocol (USB/TCP/TLS); no external adb."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
watchdog-core.workspace = true
async-trait = "0.1"
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rsa = { version = "0.9", features = ["sha1", "sha2"] }
rustls = { version = "0.23", features = ["tls12", "std", "ring"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
aes-gcm = "0.10"
curve25519-dalek = { version = "4", features = ["rand_core"] }
num-bigint = "0.4"
rand = "0.8"
nusb = "0.2"

[dev-dependencies]
watchdog-adb-mock = { path = "../adb-mock", version = "0.1.0" }
tempfile = "3.19"

[lints]
workspace = true
